<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>Simple Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131c;
      color: #f5f7ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: radial-gradient(ellipse at top, #252b40, #10131c 65%);
    }

    .calculator {
      width: min(100%, 360px);
      padding: 1.25rem;
      border: 1px solid #ffffff1a;
      border-radius: 1.5rem;
      background: #191d2a;
      box-shadow: 0 24px 70px #0008;
    }

    h1 {
      margin: 0 0 1rem;
      color: #aab3ca;
      font-size: .85rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-align: center;
      text-transform: uppercase;
    }

    .display {
      min-height: 6rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      gap: .35rem;
      overflow: hidden;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 1rem;
      background: #10131c;
      text-align: right;
    }

    .previous { min-height: 1.25rem; color: #929bb2; font-size: .9rem; }
    .current { width: 100%; overflow: hidden; font-size: clamp(2rem, 10vw, 2.8rem); font-variant-numeric: tabular-nums; text-overflow: ellipsis; white-space: nowrap; }

    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: .65rem; }

    button {
      min-height: 3.75rem;
      border: 0;
      border-radius: .9rem;
      background: #292e3e;
      color: #f5f7ff;
      font: inherit;
      font-size: 1.15rem;
      cursor: pointer;
      transition: background .15s, transform .15s;
      touch-action: manipulation;
    }

    button:hover { background: #383f53; }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 2px solid #9d8aff; outline-offset: 2px; }
    .utility { color: #c2b9ff; background: #343148; }
    .operator { color: #c2b9ff; background: #29263d; }
    .equals { grid-row: span 2; background: #7965e8; color: white; }
    .equals:hover { background: #8977f3; }
    .zero { grid-column: span 2; }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1>Calculator</h1>
    <section class="display" aria-live="polite" aria-atomic="true" aria-label="Display">
      <div class="previous" id="previous"></div>
      <div class="current" id="current">0</div>
    </section>
    <div class="keys" aria-label="Calculator keys">
      <button class="utility" data-action="clear" aria-label="Clear">AC</button>
      <button class="utility" data-action="delete" aria-label="Delete last digit">DEL</button>
      <button class="utility" data-action="sign" aria-label="Change sign">±</button>
      <button class="operator" data-operator="÷" aria-label="Divide">÷</button>
      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-operator="×" aria-label="Multiply">×</button>
      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-operator="−" aria-label="Subtract">−</button>
      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="operator" data-operator="+" aria-label="Add">+</button>
      <button class="zero" data-digit="0">0</button>
      <button data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script>
    const currentDisplay = document.querySelector('#current');
    const previousDisplay = document.querySelector('#previous');
    let current = '0';
    let previous = null;
    let operator = null;
    let replaceCurrent = false;

    function updateDisplay() {
      currentDisplay.textContent = current;
      previousDisplay.textContent = previous === null ? '' : `${previous} ${operator ?? ''}`;
    }

    function inputDigit(digit) {
      if (current === 'Error' || replaceCurrent) {
        current = digit;
        replaceCurrent = false;
      } else if (current === '0') {
        current = digit;
      } else if (current.length < 14) {
        current += digit;
      }
      updateDisplay();
    }

    function chooseOperator(nextOperator) {
      if (current === 'Error') clear();
      if (operator && !replaceCurrent) calculate();
      previous = current;
      operator = nextOperator;
      replaceCurrent = true;
      updateDisplay();
    }

    function calculate() {
      if (operator === null || previous === null) return;
      const a = Number(previous);
      const b = Number(current);
      let result;
      if (operator === '+') result = a + b;
      if (operator === '−') result = a - b;
      if (operator === '×') result = a * b;
      if (operator === '÷') result = b === 0 ? NaN : a / b;

      current = Number.isFinite(result)
        ? String(Number(result.toPrecision(12)))
        : 'Error';
      previous = null;
      operator = null;
      replaceCurrent = true;
      updateDisplay();
    }

    function clear() {
      current = '0';
      previous = null;
      operator = null;
      replaceCurrent = false;
      updateDisplay();
    }

    function handleAction(action) {
      if (action === 'clear') clear();
      if (action === 'delete') {
        if (current === 'Error' || replaceCurrent) current = '0';
        else current = current.length > 1 ? current.slice(0, -1) : '0';
        updateDisplay();
      }
      if (action === 'sign' && current !== '0' && current !== 'Error') {
        current = current.startsWith('-') ? current.slice(1) : `-${current}`;
        updateDisplay();
      }
      if (action === 'decimal' && current !== 'Error') {
        if (replaceCurrent) {
          current = '0.';
          replaceCurrent = false;
        } else if (!current.includes('.')) {
          current += '.';
        }
        updateDisplay();
      }
      if (action === 'equals') calculate();
    }

    document.querySelector('.keys').addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.digit !== undefined) inputDigit(button.dataset.digit);
      if (button.dataset.operator) chooseOperator(button.dataset.operator);
      if (button.dataset.action) handleAction(button.dataset.action);
    });

    document.addEventListener('keydown', (event) => {
      if (/^[0-9]$/.test(event.key)) inputDigit(event.key);
      else if (event.key === '.') handleAction('decimal');
      else if (event.key === 'Enter' || event.key === '=') handleAction('equals');
      else if (event.key === 'Backspace') handleAction('delete');
      else if (event.key === 'Escape') clear();
      else if (event.key === '+') chooseOperator('+');
      else if (event.key === '-') chooseOperator('−');
      else if (event.key === '*') chooseOperator('×');
      else if (event.key === '/') chooseOperator('÷');
      else return;
      event.preventDefault();
    });
  </script>
</body>
</html>
